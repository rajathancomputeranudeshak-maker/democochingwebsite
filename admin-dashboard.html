<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Vidyapeeth</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Vidyapeeth.<span style="color: var(--text-muted); font-size: 1rem; display:block;">Admin Panel</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active">📊 Overview</a></li>
                <li><a href="#">👨‍🎓 Manage Students</a></li>
                <li><a href="#">💳 Fees Management</a></li>
                <li><a href="#">📚 Upload Notes</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="index.html" class="logout-btn">🚪 Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-search">
                    <input type="text" placeholder="Search student by name or ID...">
                </div>
                <div class="header-profile">
                    <div class="profile-info">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=1e293b&color=fff" alt="Admin">
                        <span>Director Sir</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="welcome-banner" style="background: linear-gradient(135deg, var(--secondary) 0%, #334155 100%);">
                    <h2>Admin Control Center ⚙️</h2>
                    <p>Manage your coaching institute, track revenue, and monitor students.</p>
                </div>

                <div class="stats-grid dashboard-stats">
                    <div class="stat-box widget-card">
                        <h3>👨‍🎓 Total Students</h3>
                        <p class="big-text">145</p>
                    </div>
                    <div class="stat-box widget-card">
                        <h3>💳 Today's Collection</h3>
                        <p class="big-text" style="color: #10b981;">₹15,500</p>
                    </div>
                </div>

                <div class="dashboard-widgets">
                    <div class="widget">
                        <h3>➕ Quick Add Student</h3>
                        <form style="margin-top: 1rem;">
                            <input type="text" placeholder="Student Name" required style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 8px;">
                            <input type="number" placeholder="Fees Paid (₹)" required style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 8px;">
                            <button type="button" class="btn-primary" style="width: 100%;">Add Record</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
