<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vidyapeeth</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome to Vidyapeeth</h2>
            <p>Login to your digital classroom</p>
        </div>

        <div class="login-toggle">
            <button class="toggle-btn active" onclick="switchTab('student')">👨‍🎓 Student</button>
            <button class="toggle-btn" onclick="switchTab('admin')">👨‍💼 Admin</button>
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-primary">Login Now</button>
        </form>
    </div>

    <script>
        let currentLoginType = 'student';

        function switchTab(type) {
            currentLoginType = type;
            const buttons = document.querySelectorAll('.toggle-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const emailInput = document.getElementById('email');
            if(type === 'admin') {
                emailInput.placeholder = "admin@vidyapeeth.com";
            } else {
                emailInput.placeholder = "student@example.com";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        // आपकी असली मास्टर चाबी
        const firebaseConfig = {
            apiKey: "AIzaSyAXqVjD-2nlKvhzqnrY2YFPjhpu9JUxuqc",
            authDomain: "democoachingwebsite.firebaseapp.com",
            projectId: "democoachingwebsite",
            storageBucket: "democoachingwebsite.firebasestorage.app",
            messagingSenderId: "682026393153",
            appId: "1:682026393153:web:58e50285f2354816e330c0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const emailValue = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;
            const btn = event.target.querySelector('button');
            
            btn.innerText = "Checking... ⏳";

            signInWithEmailAndPassword(auth, emailValue, passwordValue)
                .then((userCredential) => {
                    alert("Login Successful! 🎉");
                    if(currentLoginType === 'admin') {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "student-dashboard.html";
                    }
                })
                .catch((error) => {
                    alert("गलत ईमेल या पासवर्ड! कृपया दोबारा चेक करें। ❌");
                    btn.innerText = "Login Now"; 
                });
        });
    </script>
</body>
</html>
