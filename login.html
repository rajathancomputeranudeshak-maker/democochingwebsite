<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vidyapeeth</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-image">
                <h2>Welcome Back!</h2>
                <p>Log in to access your premium dashboard, mock tests, and library seat status.</p>
            </div>

            <div class="login-form-container">
                <div class="login-header">
                    <h2>Vidyapeeth.</h2>
                    <p>Enter your credentials to continue</p>
                </div>

                <div class="login-toggle">
                    <button class="toggle-btn active" onclick="switchTab('student')">Student</button>
                    <button class="toggle-btn" onclick="switchTab('admin')">Admin</button>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="student@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-options">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-primary w-100">Login Now</button>
                </form>

                <p class="back-home"><a href="index.html">← Back to Home Page</a></p>
            </div>
        </div>
    </div>
<script>
        // यह याद रखेगा कि कौन सा टैब सेलेक्टेड है (default student है)
        let currentLoginType = 'student';

        // Student/Admin Tab Switch Logic
        function switchTab(type) {
            currentLoginType = type; // टैब बदलते ही टाइप अपडेट हो जाएगा
            
            const buttons = document.querySelectorAll('.toggle-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const emailInput = document.getElementById('email');
            if(type === 'admin') {
                emailInput.placeholder = "admin@vidyapeeth.com";
            } else {
                emailInput.placeholder = "student@example.com";
            }
        }

        // Smart Login Button Redirect Logic
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // फॉर्म को रिफ्रेश होने से रोकेगा
            
            // अब यह चेक करेगा कि एडमिन है या स्टूडेंट, और उसी पेज पर भेजेगा!
            if(currentLoginType === 'admin') {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "student-dashboard.html";
            }
        });
    </script>
   
</body>
</html>
